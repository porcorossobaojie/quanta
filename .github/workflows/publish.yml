name: Publish to PyPI

# 触发条件：仅在推送版本标签 (v*) 时发布，避免每次 push main 都发版
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Validate package metadata
      run: |
        python -m pip install tomlkit
        python -c "import tomlkit; tomlkit.parse(open('pyproject.toml', encoding='utf-8').read()); print('pyproject.toml OK')"

    - name: Build package
      run: python -m build

    - name: Verify sdist/wheel contents
      run: |
        python -m pip install dist/*.whl
        python -c "import quanta; print('import quanta OK, version:', quanta.__version__)"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/
      run: |
        python -m twine upload --skip-existing dist/*
