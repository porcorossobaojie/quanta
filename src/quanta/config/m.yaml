# =============================================================================
# Data flow and processing configuration, defining listing criteria,
# asset status filters, and trade key mappings.
# -----------------------------------------------------------------------------
# 数据流与处理配置, 定义了上市标准, 资产状态过滤及交易键映射.
# -----------------------------------------------------------------------------

# =============================================================================
# Default start date for historical data processing.
# -----------------------------------------------------------------------------
# 历史数据处理的默认起始日期.
# -----------------------------------------------------------------------------
start_date: '2019-01-01'

# =============================================================================
# Standard keys for trading data fields like prices and returns.
# -----------------------------------------------------------------------------
# 交易数据字段的标准键, 如价格和收益率.
# -----------------------------------------------------------------------------
trade_keys: &public_keys
    returns: ret
    avgprice: avgprice
    avgprice_adj: avgprice_adj
    high: high
    high_limit: high_limit
    low: low
    low_limit: low_limit
    close: close
    close_adj: close_adj
    preclose: preclose
    preclose_adj: preclose_adj
    open: open
    tradestatus: tradestatus
    post_factor: post_factor
    amount: amount
    volume: volume
    turnover: free_turnover
    trade_dt: trade_dt
    ann_dt: ann_dt
    report_period: report_period
    astock_code: astock_code
    afund_code: afund_code
    aindex_code: aindex_code
    afund_shares: shares

cap:
    <<: *public_keys
    trade_price: avgprice
    settle_price: close
    unit_types: [weight, share, assets]
    state_types: [signal, order, trade, settle]
    recommand_settings:
        is_adj: True
        trade_cost: 0.00075
        untrade_limit: 0.01
        unit: weight
        state: signal
        cash: 0
        price_mapping:
            signal: close
            order: preclose
            trade: avgprice
            settle: close
